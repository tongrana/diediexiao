plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tq.stack'
    compileSdk 34

    defaultConfig {
        applicationId "com.tq.stack"
        minSdk 23
        targetSdk 34
        versionCode 10
        versionName "1.8"
    }

    // 固定签名：保证每次云端构建的证书一致，新包能直接覆盖安装旧版
    signingConfigs {
        fixed {
            storeFile file("../keystore.jks")
            storePassword "tq123456"
            keyAlias "diediexiao"
            keyPassword "tq123456"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
