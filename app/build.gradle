plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tq.stack'
    compileSdk 34

    defaultConfig {
        applicationId "com.tq.stack"
        minSdk 23
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // 演示用；正式发布请换成自己的签名
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
